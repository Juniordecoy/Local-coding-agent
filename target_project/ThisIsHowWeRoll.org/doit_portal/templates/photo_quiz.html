{% extends "base.html" %}
{% block title %}Photo Quality Quiz{% endblock %}

{% block content %}
<section class="panel">

  <h2 class="quiz-title">Photo Quality Quiz</h2>

  {% if submitted %}
    <div class="success-msg">Submitted — thank you!</div>
  {% endif %}

  <form class="ojt-form" method="POST" action="{{ url_for('photo_quiz') }}">

    <div class="ojt-grid-2">
      <div class="field">
        <label for="your_name"><span class="req"></span>Name</label>
        <input id="your_name" name="your_name" type="text" required>
      </div>

      <div class="field">
        <label for="email"><span class="req"></span>Email Address</label>
        <input id="email" name="email" type="text" required>
      </div>
    </div>

    {% for q in questions %}
      <div class="photo-quiz-block">
        <img class="photo-quiz-img"
             src="{{ url_for('static', filename=q.img) }}"
             alt="Photo quiz image {{ q.id }}">

        <div class="quiz-q">
          <div class="req">{{ q.id }}. Is the image above a good or a bad campaign photo?</div>

          <label class="radio-line">
            <input type="radio" name="q{{ q.id }}_rating" value="Good" required>
            Good
          </label>

          <label class="radio-line">
            <input type="radio" name="q{{ q.id }}_rating" value="Bad" required>
            Bad
          </label>

          <label class="req">Why?</label>
          <textarea name="q{{ q.id }}_why" rows="2" required></textarea>
        </div>
      </div>
    {% endfor %}

    <div style="position:absolute; left:-9999px;">
      <input type="text" name="do_not_fill" autocomplete="off">
    </div>

    <div class="quiz-block">
      <button class="submit-btn" type="submit">Submit</button>
    </div>

  </form>
</section>
{% endblock %}
