{% extends "base.html" %}
{% block title %}Post-Training Recap{% endblock %}

{% block content %}
<section class="panel">

  <h2 class="panel-title">Post-Training Recap</h2>

  {% if submitted %}
    <div class="success-msg">Thanks — your recap was submitted.</div>
  {% endif %}

  <form class="ojt-form" method="POST" action="{{ url_for('post_training_recap') }}">

    <div class="ojt-grid-2">
      <div class="field">
        <label for="your_name"><span class="req"></span> 1. Your name</label>
        <input id="your_name" name="your_name" type="text" required>
      </div>

      <div class="field">
        <label for="email"><span class="req"></span>2. Email</label>
        <input id="email" name="email" type="text" required>
      </div>

      <div class="field ojt-span-2">
        <label for="date_time"><span class="req"></span> 3. Date and Time</label>
        <input id="date_time" name="date_time" type="datetime-local" required>
      </div>
    </div>

    <!-- 1 -->
    <div class="quiz-block">
      <label class="quiz-q">* 1) What is the number one goal of do it outdoors?</label>
      <label class="quiz-opt"><input type="radio" name="q1" value="a" required> a. Present the cleanest mobile billboard to the client.</label>
      <label class="quiz-opt"><input type="radio" name="q1" value="b"> b. Be the number one mobile billboard advertising company in the US</label>
      <label class="quiz-opt"><input type="radio" name="q1" value="c"> c. For our drivers to be on time, and on the route, where they are supposed to be.</label>
      <label class="quiz-opt"><input type="radio" name="q1" value="d"> d. For our drivers to be professional and pleasant to the public and the client.</label>
    </div>

    <!-- 2 -->
    <div class="quiz-block">
      <label class="quiz-q">* 2) Drivers are guaranteed hours every week.</label>
      <label class="quiz-opt"><input type="radio" name="q2" value="true" required> a. True</label>
      <label class="quiz-opt"><input type="radio" name="q2" value="false"> b. False</label>
    </div>

    <!-- 3 -->
    <div class="quiz-block">
      <label class="quiz-q">* 3) The do it outdoors dress code calls for:</label>
      <label class="quiz-opt"><input type="radio" name="q3" value="a" required> a. Hat – optional; if worn, must be plain or a do it outdoors hat; cannot be worn backwards or sideways. Cannot have any logos.</label>
      <label class="quiz-opt"><input type="radio" name="q3" value="b"> b. Outerwear – Use discretion with outerwear. No large logo brands or team-oriented</label>
      <label class="quiz-opt"><input type="radio" name="q3" value="c"> c. Footwear - A solid plain shoe (preferably black or brown); no open-toes or open-heels</label>

      <label class="quiz-opt"><input type="radio" name="q3" value="e"> e. Pants – black, gray or dark blue dress jeans/pants or shorts (think UPS style). Belted with a tucked in shirt. No baggy jeans/shorts; must be plain 5-pocket jeans.</label>

      <label class="quiz-opt"><input type="radio" name="q3" value="g"> g. A, B, and D</label>
